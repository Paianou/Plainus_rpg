<!DOCTYPE html>
<!--
  PAINEL DO JOGADOR — a ficha e (nas próximas etapas) a mesa vista
  pelo lado de quem joga.

  Por que uma moldura PRÓPRIA, e não a do layout.js: aquela barra é do
  Mestre (menu de sessão, convite, áudio, o códice com as oito telas
  dele). O jogador tem outra conversa com a mesa — e mostrar a ele os
  botões do Mestre, mesmo desligados, seria convite para fuçar. Do
  layout.js só aproveitamos os ajudantes (criar, criarBotao, o recado).

  Os arquivos desta tela:
    jogador.html      o esqueleto (o que você está lendo)
    jogador.js        a moldura, as abas e a ficha
    jogador-mesa.js   as abas Mesa e Diário, e o rolador
    jogador-uso.js    ataques, magias (e a aba Magias), recursos, descansos
    jogador-inventario.js   a aba Inventário
    jogador-consulta.js     as abas Regras e Anotações
    visao.js          o que o jogador vê e pode fazer (o futuro servidor)
    planta.js         a planta da cena, a mesma da Visão Geral
    ficha.js          as contas da ficha (CA, perícias, PV...)
    regras.js     perícias, armaduras, compra de pontos
    dados.js      o Estado e regrasPersonagem()
    campanhas.js  sessão e campanha guardadas

  AVISO DE SEGURANÇA: como no painel do Mestre, a checagem de papel
  é uma placa, não uma porta. A explicação está no topo do jogador.js.
-->
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08090b">

  <title>Painel do jogador — Plainus RPG</title>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2315171c'/%3E%3Cpath d='M9 25 L9 15 Q16 6 23 15 L23 25' fill='none' stroke='%234d8dff' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Nasce escondido: se o JS falhar ou a sessão não for de jogador, nada aparece. -->
  <!--
    O MESMO esqueleto do painel do Mestre (.app-mesa > .corpo-mesa >
    .codice + .area-trabalho), de propósito: as duas telas dividem as
    medidas, as quebras de tela e a pele. Mudou o códice do Mestre,
    o do jogador acompanha — não há uma cópia para esquecer.
  -->
  <div class="app-mesa app-jogador" id="app" hidden>
    <div class="faixa-aviso">Sem servidor ainda — o painel lê a campanha guardada neste navegador.</div>
    <header class="barra-topo" id="barraJogador"></header>

    <div class="corpo-mesa" id="corpoJogador">
      <!-- A navegação entre as abas: o códice, colado à esquerda. -->
      <nav class="codice nav-jogador" id="navJogador" aria-label="Seções do painel"></nav>

      <main class="area-trabalho">
        <!-- Onde você está: o nome da aba e para que ela serve (o lugar
             que as abas Panorama/Grupo/Cena ocupam no Mestre). -->
        <div class="cabeca-aba" id="cabecaAba"></div>

        <!-- O conteúdo da aba e, à direita, campanha, dados e party. -->
        <div class="colunas-jogador">
          <section id="principal"></section>
          <aside id="lateral"></aside>
        </div>
      </main>
    </div>
  </div>

  <div class="recados" id="recados" role="status" aria-live="polite"></div>

  <noscript>
    <div class="tela-restrita">
      <div class="cartao">
        <h1>JavaScript desligado</h1>
        <p>O painel monta a sua ficha a partir da campanha, então precisa de JavaScript para funcionar.</p>
      </div>
    </div>
  </noscript>

  <script src="icones.js"></script>
  <script src="campanhas.js"></script>
  <script src="dados.js"></script>
  <script src="imagens.js"></script>
  <script src="regras.js"></script>
  <!-- O layout.js entra pelos ajudantes (criar, criarBotao, recado,
       dado). Layout.iniciar(), que monta a moldura do MESTRE, nunca é
       chamado nesta página. -->
  <script src="layout.js"></script>
  <script src="bichos.js"></script>        <!-- silhuetas dos inimigos na planta -->
  <script src="planta.js"></script>        <!-- a planta da cena (aba Mesa) -->
  <script src="ficha.js"></script>
  <script src="visao.js"></script>         <!-- o que o jogador vê e pode fazer -->
  <script src="chat.js"></script>           <!-- o chat (aba Chat) -->
  <script src="vendor/three.min.js"></script> <!-- o 3D dos dados (Three.js r158) -->
  <script src="dados3d.js"></script>       <!-- a animação dos dados -->
  <script src="jogador-mesa.js"></script>  <!-- abas Mesa e Diário, rolador -->
  <script src="jogador-uso.js"></script>   <!-- ataques, magias, recursos, descansos -->
  <script src="jogador-inventario.js"></script> <!-- aba Inventário -->
  <script src="jogador-consulta.js"></script>   <!-- abas Regras e Anotações -->
  <script src="jogador.js"></script>
</body>

</html>
