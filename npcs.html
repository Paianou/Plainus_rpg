<!DOCTYPE html>
<!--
  NPCs & FACÇÕES — o elenco da campanha.

  Primeira tela em que se ESCREVE. Compêndio e Bestiário mostram o
  livro, que ninguém edita; aqui o conteúdo é seu: você cria o NPC,
  muda a atitude dele, marca quando morre. Por isso os NPCs moram em
  Estado.npcs (dados.js) e não em regras.js.

  Os arquivos desta tela:
    npcs.html   o esqueleto (o que você está lendo)
    npcs.js     lista, formulário e facções
    dados.js    Estado.npcs e Estado.faccoes
    layout.js   a moldura
    icones.js   os ícones


  SOBRE O CAMPO "SEGREDO"
  Ele é o melhor exemplo do aviso de segurança que está no topo do
  layout.js. Quando houver servidor, o segredo de um NPC não pode ser
  escondido com CSS nem com um `if` no JavaScript: ele simplesmente
  não pode ser enviado ao navegador de quem não é o mestre. Qualquer
  coisa que chega ao navegador do jogador, o jogador consegue ler.
-->
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08090b">

  <title>NPCs & Facções — Plainus RPG</title>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2315171c'/%3E%3Cpath d='M9 25 L9 15 Q16 6 23 15 L23 25' fill='none' stroke='%234d8dff' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">

  <link rel="stylesheet" href="style.css">
</head>

<body data-secao="npcs">

  <div class="app-mesa" id="app" hidden>

    <div id="faixaDemo"></div>
    <header id="barraTopo"></header>

    <div class="corpo-mesa">
      <nav id="codice"></nav>

      <main class="area-trabalho">

        <div class="cabecalho-combate">
          <div>
            <div class="cena-etiquetas">
              <span class="pilula azul" id="seloTotal">—</span>
            </div>
            <h1>
              <span data-ico="npcs" data-tamanho="22"></span>
              NPCs &amp; Facções
            </h1>
            <div class="sub">Quem é quem, o que cada um quer — e o que só você sabe.</div>
          </div>

          <div class="linha-botoes">
            <button class="botao pequeno" type="button" data-acao="novo">
              <span data-ico="mais" data-tamanho="14"></span> Novo NPC
            </button>
            <button class="botao fantasma pequeno" type="button" data-acao="sortear">
              <span data-ico="recarregar" data-tamanho="14"></span> Sortear um
            </button>
          </div>
        </div>


        <div class="busca-grande">
          <span data-ico="busca" data-tamanho="18"></span>
          <input type="text" id="busca" autocomplete="off" spellcheck="false"
                 placeholder="Procure por nome, papel, local ou pelo que ele quer…"
                 aria-label="Procurar no elenco">
          <button class="limpar" type="button" id="limparBusca" aria-label="Limpar busca" hidden>×</button>
        </div>


        <div class="filtros-compendio">
          <div class="grupo-filtro" id="filtroLista"></div>
          <div class="grupo-filtro" id="filtroAtitude"></div>
          <div class="grupo-filtro" id="filtroFaccao"></div>
        </div>


        <div class="colunas-compendio">
          <section>
            <div class="titulo-coluna">
              <h2><span data-ico="npcs" data-tamanho="17"></span> <span id="tituloLista">Elenco</span></h2>
              <span class="sub" id="contagem">—</span>
            </div>
            <div class="lista-compendio" id="lista"></div>
          </section>

          <aside>
            <div class="detalhe-compendio" id="detalhe"></div>
          </aside>
        </div>

      </main>
    </div>
  </div>

  <div class="recados" id="recados" role="status" aria-live="polite"></div>

  <noscript>
    <div class="tela-restrita">
      <div class="cartao">
        <h1>JavaScript desligado</h1>
        <p>Esta página monta o elenco a partir dos dados da campanha, então precisa de JavaScript para funcionar.</p>
      </div>
    </div>
  </noscript>

  <script src="icones.js"></script>
  <script src="aviso-saida.js"></script>
  <script src="campanhas.js"></script>
  <script src="dados.js"></script>
  <script src="acoes.js"></script>
  <script src="regras.js"></script>
  <script src="audio.js"></script>
  <script src="busca.js"></script>
  <script src="avisos.js"></script>
  <script src="visao.js"></script>
  <script src="chat.js"></script>
  <script src="layout.js"></script>
  <script src="atalhos.js"></script>
  <script src="conexao.js"></script>
  <script src="npcs.js"></script>
</body>

</html>
