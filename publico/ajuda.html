<!DOCTYPE html>
<!--
  AJUDA — o que é do site, e não do jogo: como usar a mesa.

  Fica no grupo do pé do códice (Perfil, Configurações, Ajuda, Sair).
  Junta o que estava espalhado ou só na cabeça de quem montou o site:
  os atalhos (antes, só na janela "?"), o que cada tela faz (a linha
  "descricao" de Layout.SECOES) e como jogar com os amigos pelo link do
  túnel (antes, só no README).

  Os arquivos desta tela:
    ajuda.html  o esqueleto (o que você está lendo)
    ajuda.js    o comportamento
-->
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08090b">

  <title>Ajuda — Plainus RPG</title>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2315171c'/%3E%3Cpath d='M9 25 L9 15 Q16 6 23 15 L23 25' fill='none' stroke='%234d8dff' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">

  <link rel="stylesheet" href="style.css">
</head>

<body data-secao="ajuda">

  <div class="app-mesa" id="app" hidden>

    <header id="barraTopo"></header>

    <div class="corpo-mesa">
      <nav id="codice"></nav>

      <main class="area-trabalho">

        <div class="cabecalho-combate">
          <div>
            <h1>
              <span data-ico="ajuda" data-tamanho="22"></span>
              Ajuda
            </h1>
            <div class="sub">Atalhos, o que cada tela faz e como jogar com os amigos pelo link.</div>
          </div>
        </div>

        <!-- O ajuda.js preenche: um cartão por assunto. -->
        <div class="grade-configuracoes" id="ajuda"></div>

      </main>
    </div>
  </div>

  <div class="recados" id="recados" role="status" aria-live="polite"></div>

  <noscript>
    <div class="tela-restrita">
      <div class="cartao">
        <h1>JavaScript desligado</h1>
        <p>Esta página monta a ajuda a partir dos dados da mesa, então precisa de JavaScript para funcionar.</p>
      </div>
    </div>
  </noscript>

  <script src="icones.js"></script>
  <script src="aviso-saida.js"></script>
  <script src="campanhas.js"></script>
  <script src="modelo.js"></script>
  <script src="dados.js"></script>
  <script src="acoes.js"></script>
  <script src="audio.js"></script>
  <script src="busca.js"></script>
  <script src="avisos.js"></script>
  <script src="regras.js"></script>
  <script src="visao.js"></script>
  <script src="chat.js"></script>
  <script src="layout.js"></script>
  <script src="atalhos.js"></script>
  <script src="conexao.js"></script>
  <script src="ajuda.js"></script>
</body>

</html>
