<!DOCTYPE html>
<!--
  CONFIGURAÇÕES — o que é do site, e não do jogo.

  Fica no grupo do pé do códice (Perfil, Configurações, Ajuda, Sair),
  longe das telas da campanha. Junta num lugar o que estava espalhado:
  as preferências deste navegador (antes, botões soltos em cada tela),
  o "Editar campanha" e os Acessos (antes, dentro do cartão "Sobre a
  campanha", que nasce fechado) e o backup (antes, só na entrada).

  Nada aqui é novo por dentro: cada seção chama o que já existia
  (Dados3D, Layout.copiarCodigo, Backup.baixar) ou leva à página que já
  faz o trabalho (criar-campanha.html?editar=1, acessos.html).

  Os arquivos desta tela:
    configuracoes.html  o esqueleto (o que você está lendo)
    configuracoes.js    o comportamento
-->
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08090b">

  <title>Configurações — Plainus RPG</title>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2315171c'/%3E%3Cpath d='M9 25 L9 15 Q16 6 23 15 L23 25' fill='none' stroke='%234d8dff' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">

  <link rel="stylesheet" href="style.css">
</head>

<body data-secao="configuracoes">

  <div class="app-mesa" id="app" hidden>

    <header id="barraTopo"></header>

    <div class="corpo-mesa">
      <nav id="codice"></nav>

      <main class="area-trabalho">

        <div class="cabecalho-combate">
          <div>
            <h1>
              <span data-ico="engrenagem" data-tamanho="22"></span>
              Configurações
            </h1>
            <div class="sub">O que é do site, e não do jogo: este navegador, a campanha, quem entra e o backup.</div>
          </div>
        </div>

        <!-- O configuracoes.js preenche: um cartão por seção. -->
        <div class="grade-configuracoes" id="configuracoes"></div>

      </main>
    </div>
  </div>

  <div class="recados" id="recados" role="status" aria-live="polite"></div>

  <noscript>
    <div class="tela-restrita">
      <div class="cartao">
        <h1>JavaScript desligado</h1>
        <p>Esta página monta as configurações a partir dos dados da mesa, então precisa de JavaScript para funcionar.</p>
      </div>
    </div>
  </noscript>

  <script src="icones.js"></script>
  <script src="aviso-saida.js"></script>
  <script src="campanhas.js"></script>
  <script src="modelo.js"></script>
  <script src="dados.js"></script>
  <script src="acoes.js"></script>
  <script src="audio.js"></script>
  <script src="busca.js"></script>
  <script src="avisos.js"></script>
  <script src="regras.js"></script>
  <script src="visao.js"></script>
  <script src="chat.js"></script>
  <script src="layout.js"></script>
  <script src="atalhos.js"></script>
  <script src="conexao.js"></script>
  <script src="backup.js"></script>
  <script src="dados3d.js"></script>
  <script src="configuracoes.js"></script>
</body>

</html>
