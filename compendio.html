<!DOCTYPE html>
<!--
  COMPÊNDIO & MAGIAS — a tela de consulta.

  É o livro de regras à mão: procurar uma magia no meio do turno,
  conferir o alcance de Bola de Fogo, lembrar o que Paralisado faz.
  Por isso a tela inteira gira em torno da busca, e o foco já começa
  nela — você abre e digita.

  O formato é "lista + detalhe": a lista filtra à esquerda, o detalhe
  acompanha à direita. As próximas telas de consulta (Bestiário, NPCs)
  vão repetir esse mesmo formato.

  Os arquivos desta tela:
    compendio.html  o esqueleto (o que você está lendo)
    compendio.js    a busca, os filtros e o detalhe
    regras.js       o catálogo do sistema (magias, equipamento)
    dados.js        o Estado da mesa (as magias fixadas ficam nele)
    layout.js       a moldura
    icones.js       os ícones

  Repare que são DOIS arquivos de dados, e a diferença importa:
  regras.js é o livro (não muda nunca), dados.js é a sua mesa (muda o
  tempo todo). Só o segundo é salvo.

  AVISO DE SEGURANÇA: a checagem de papel é uma placa, não uma porta.
  A explicação completa está no topo do layout.js.
-->
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08090b">

  <title>Compêndio & Magias — Plainus RPG</title>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2315171c'/%3E%3Cpath d='M9 25 L9 15 Q16 6 23 15 L23 25' fill='none' stroke='%234d8dff' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">

  <link rel="stylesheet" href="style.css">
</head>

<body data-secao="compendio">

  <div class="app-mesa" id="app" hidden>

    <div id="faixaDemo"></div>
    <header id="barraTopo"></header>

    <div class="corpo-mesa">
      <nav id="codice"></nav>

      <main class="area-trabalho">

        <div class="cabecalho-combate">
          <div>
            <div class="cena-etiquetas">
              <span class="pilula azul" id="seloTotal">—</span>
            </div>
            <h1>
              <span data-ico="compendio" data-tamanho="22"></span>
              Compêndio &amp; Magias
            </h1>
            <div class="sub">Consulta rápida de magias, equipamento e condições.</div>
          </div>
        </div>


        <!-- A busca. autofocus porque é para isso que se abre a tela. -->
        <div class="busca-grande">
          <span data-ico="busca" data-tamanho="18"></span>
          <input type="text" id="busca" autocomplete="off" spellcheck="false"
                 placeholder="Procure por nome, escola ou pelo texto: fogo, concentração, paralisado…"
                 aria-label="Procurar no compêndio" autofocus>
          <button class="limpar" type="button" id="limparBusca" aria-label="Limpar busca" hidden>×</button>
        </div>


        <!-- Filtros. O compendio.js preenche os grupos de nível e
             classe, porque eles saem do catálogo. -->
        <div class="filtros-compendio">
          <div class="grupo-filtro" id="filtroTipo"></div>
          <div class="grupo-filtro" id="filtroNivel"></div>
          <div class="grupo-filtro" id="filtroClasse"></div>
        </div>


        <div class="colunas-compendio">
          <section>
            <div class="titulo-coluna">
              <h2><span data-ico="tabelas" data-tamanho="17"></span> Resultados</h2>
              <span class="sub" id="contagem">—</span>
            </div>
            <div class="lista-compendio" id="lista"></div>
          </section>

          <aside>
            <div class="detalhe-compendio" id="detalhe"></div>
          </aside>
        </div>

      </main>
    </div>
  </div>

  <div class="recados" id="recados" role="status" aria-live="polite"></div>

  <noscript>
    <div class="tela-restrita">
      <div class="cartao">
        <h1>JavaScript desligado</h1>
        <p>Esta página monta a busca a partir do catálogo, então precisa de JavaScript para funcionar.</p>
      </div>
    </div>
  </noscript>

  <script src="icones.js"></script>
  <script src="campanhas.js"></script>
  <script src="dados.js"></script>
  <script src="audio.js"></script>
  <script src="busca.js"></script>
  <script src="avisos.js"></script>
  <script src="regras.js"></script>
  <script src="layout.js"></script>
  <script src="compendio.js"></script>
</body>

</html>
